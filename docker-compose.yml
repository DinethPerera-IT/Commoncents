# CommonCents — Dina's homelab deployment.
# Port 3040 avoids the reserved set (80, 3000, 3001, 3005, 3010, 3020, 3030, 8080, 19999).
# Fixed project name: volumes resolve to commoncents_db_data / commoncents_app_data from any
# folder. Without it Compose names the project after the folder, and a copy run from elsewhere
# would start on new, empty volumes.
name: commoncents

services:
  app:
    build: .
    container_name: commoncents
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Open on the home network on purpose: flatmates use http://<server-ip>:3040 directly.
      # Caddy on the host also proxies commoncents.home.internal -> localhost:3040.
      - "3040:3040"
    stop_grace_period: 15s   # the app shuts down cleanly on SIGTERM
    volumes:
      - app_data:/app/data
    mem_limit: 512m
    cpus: 1.0

  db:
    image: postgres:16-alpine
    container_name: commoncents-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    # DB is not published to the host — reachable only on the compose network.

volumes:
  db_data:
  app_data:
